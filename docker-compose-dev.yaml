name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - testing_net
    volumes:
      - ./server/config.ini:/config.ini

  client1:
    container_name: client1
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=1
      - NOMBRE=${NOMBRE:-GASTON}
      - APELLIDO=${APELLIDO:-AVILA}
      - DOCUMENTO=${DOCUMENTO:-41780971}
      - NACIMIENTO=${NACIMIENTO:-1999-03-19}
      - NUMERO=${NUMERO:-9999}
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data:/.data

networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24
